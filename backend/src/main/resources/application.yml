server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: tutornow-backend
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/tutornow_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
  platform:
    commission-percentage: 10.0
  payhere:
    merchant-id: "1211111" # Sandbox merchant ID
    merchant-secret: "404E635266556A586E3272357538782F"
    currency: "LKR"
    sandbox-mode: true
  zoom:
    account-id: "${ZOOM_ACCOUNT_ID:}"
    client-id: "${ZOOM_CLIENT_ID:}"
    client-secret: "${ZOOM_CLIENT_SECRET:}"
