version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: tutornow-mysql
    restart: always
    environment:
      MYSQL_DATABASE: tutornowdb
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: tutornow_user
      MYSQL_PASSWORD: tutornow_password
    
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tutornow-backend
    restart: always
    depends_on:
      - mysql-db
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/tutornowdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: tutornow_user
      SPRING_DATASOURCE_PASSWORD: tutornow_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

volumes:
  mysql_data:
